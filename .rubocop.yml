AllCops:
  NewCops: enable
  SuggestExtensions: false
  TargetRubyVersion: 3.2

Layout/LineLength:
  Max: 120

Metrics/AbcSize:
  Max: 40

Metrics/BlockLength:
  Max: 40
  Exclude:
    - Rakefile
    - lib/tasks/**/*.rake
    - spec/**/*.rb

Metrics/ClassLength:
  Max: 160

Metrics/CyclomaticComplexity:
  Max: 14

Metrics/MethodLength:
  Max: 46

Metrics/ParameterLists:
  Max: 7

Metrics/PerceivedComplexity:
  Max: 14

Style/Documentation:
  Enabled: false
